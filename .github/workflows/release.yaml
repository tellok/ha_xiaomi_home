name: Release

on:
  release:
    types: [published]

jobs:
  release-zip:
    runs-on:
    - self-hosted
    - tower
    - ubuntu-latest
    - tower-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v4

    - name: ZIP Component Dir
      run: |
        cd ${{ github.workspace }}/custom_components/xiaomi_home
        zip -r xiaomi_home.zip ./

    - name: Upload zip to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ github.workspace }}/custom_components/xiaomi_home/xiaomi_home.zip
        asset_name: xiaomi_home.zip
        tag: ${{ github.ref }}
        overwrite: true
